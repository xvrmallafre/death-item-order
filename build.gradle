plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.1'
    id 'maven-publish'
}

version = '1.0.0'
group = 'dev.deathorder'

repositories { mavenCentral() }

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'net.fabricmc:fabric-loader-junit:0.19.5'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
test { useJUnitPlatform() }
jar { from('LICENSE') }

tasks.register('sourceBundle', Zip) {
    archiveFileName = "death-item-order-${project.version}-project.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(projectDir) {
        include 'src/**', 'gradle/**', 'gradlew', 'gradlew.bat'
        include 'build.gradle', 'settings.gradle', 'gradle.properties'
        include 'README.md', 'LICENSE', '.gitignore'
    }
}
build.dependsOn sourceBundle
